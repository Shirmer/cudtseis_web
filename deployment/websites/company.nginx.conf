server {
    server_name deepseek-earth.cdutseis.com;
    root /srv/deepseek-earth/current;
    index index.html;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    location = /api/release/latest {
        proxy_pass http://127.0.0.1:18081;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
    }
    location ^~ /api/ { return 404; }
    location ~ /\. { deny all; }
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location / { try_files $uri $uri/ /index.html; }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/deepseek-earth.cdutseis.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/deepseek-earth.cdutseis.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

# IP preview retains the existing App API and admin paths.
server {
    listen 80;
    server_name 162.14.113.163;
    root /srv/deepseek-earth/current;
    index index.html;
    server_tokens off;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    location /api/ {
        proxy_pass http://127.0.0.1:18081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 100m;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
    }
    location /admin {
        proxy_pass http://127.0.0.1:18081;
        proxy_set_header Host $host;
    }
    location ~ /\. { deny all; }
    location /assets/ { try_files $uri =404; expires 30d; }
    location / { try_files $uri $uri/ /index.html; }
}
server {
    if ($host = deepseek-earth.cdutseis.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name deepseek-earth.cdutseis.com;
    return 404; # managed by Certbot


}