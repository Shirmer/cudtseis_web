# Generic example only; not the live company/App virtual host.
server {
    server_name company.example.com;
    root /srv/www/company/current;
    index index.html;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    location = /api/release/latest {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
    }
    location ^~ /api/ { return 404; }
    location ~ /\. { deny all; }
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location / { try_files $uri $uri/ /index.html; }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/company.example.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/company.example.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    listen 80;
    server_name company.example.com;
    location / { return 308 https://company.example.com$request_uri; }
}
