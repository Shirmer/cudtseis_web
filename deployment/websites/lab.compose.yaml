name: earthquake-center
services:
  web:
    image: geocamera/nginx:1.28
    pull_policy: never
    container_name: cdut-earthquake-center-web
    network_mode: host
    entrypoint: ["nginx", "-g", "daemon off;"]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE, CHOWN, SETUID, SETGID, KILL]
    security_opt: [no-new-privileges:true]
    volumes:
      - ./current:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
      - /var/cache/nginx:rw,noexec,nosuid,size=16m,mode=1777
    mem_limit: 96m
    cpus: 0.50
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
