# HTTPS ingress only: frp forwards to the school website on local port 80.
server {
    server_name seis.cdutseis.com;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    location / {
        proxy_pass http://127.0.0.1:18082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/seis.cdutseis.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/seis.cdutseis.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = seis.cdutseis.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name seis.cdutseis.com;
    return 404; # managed by Certbot


}