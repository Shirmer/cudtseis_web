# Product website; preserve company and App API virtual hosts separately.
server {
    listen 443 ssl;
    server_name geocamera.deepseek-earth.cdutseis.com;
    root /srv/deepseek-earth/current;
    index geocamera.html;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/geocamera.deepseek-earth.cdutseis.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/geocamera.deepseek-earth.cdutseis.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    location = /api/release/latest {
        proxy_pass http://127.0.0.1:18081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
        add_header Cache-Control no-store always;
    }
    location ^~ /api/ { return 404; }
    location ~ /\. { deny all; }
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
    }
    location = /index.html { rewrite ^ /geocamera.html last; }
    location ~ \.html$ {
        try_files $uri =404;
        add_header Cache-Control no-cache always;
        add_header X-Content-Type-Options nosniff always;
    }
    location / { try_files $uri $uri/ /geocamera.html; }
}
server {
    listen 80;
    server_name geocamera.deepseek-earth.cdutseis.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        try_files $uri =404;
    }
    location / { return 308 https://geocamera.deepseek-earth.cdutseis.com$request_uri; }
}
